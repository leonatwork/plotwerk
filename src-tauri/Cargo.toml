[package]
name = "plotwerk"
version = "0.2.0"
description = "Plotwerk – Romane schreiben und planen"
authors = ["Leon"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "plotwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-sql = { version = "2.5", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6", features = ["apple-native"] }
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }
percent-encoding = "2.3"
plotwerk-ki = { path = "crates/plotwerk-ki" }
tauri-plugin-updater = "2.13"

[dev-dependencies]
tempfile = "3"

[workspace]
members = [".", "crates/plotwerk-ki"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
